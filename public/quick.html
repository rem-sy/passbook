<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快捷面板 · 密码本</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 快捷面板紧凑样式（基于主 style.css 的 CSS 变量） */
    html, body.quick-body { height: auto; }
    body.quick-body {
      margin: 0; padding: 0; overflow: hidden;
      background: var(--bg, #f6f7f9); color: var(--text, #222);
      font-family: inherit; font-size: 14px;
      -webkit-user-select: none; user-select: none;
    }
    .q-gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--bg, #f6f7f9); }
    .q-gate .q-gate-box { width: 82%; max-width: 320px; text-align: center; }
    .q-gate h3 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .q-gate input {
      width: 100%; box-sizing: border-box; border: 1px solid var(--line, #d8dce2); border-radius: 10px;
      padding: 12px; font-size: 16px; letter-spacing: 4px; text-align: center; outline: none;
      background: var(--card, #fff); color: var(--text, #222);
    }
    .q-gate .q-err { color: var(--danger, #d43); font-size: 12.5px; min-height: 18px; margin: 8px 0; }
    .q-gate .btn { width: 100%; margin-top: 4px; }
    .q-gate .q-gate-hint { margin-top: 14px; font-size: 12px; color: var(--muted, #888); }
    .q-gate .q-gate-hint a { cursor: pointer; text-decoration: underline; }

    .q-app { display: flex; flex-direction: column; height: 100vh; }
    .q-tabs { display: flex; gap: 4px; padding: 10px 10px 0; }
    .q-tabs button {
      flex: 1; border: 1px solid var(--line, #d8dce2); border-bottom: none; border-radius: 10px 10px 0 0;
      background: var(--card, #fff); color: var(--muted, #888); padding: 8px 0; font-size: 13px; cursor: pointer;
    }
    .q-tabs button.on { color: var(--text, #222); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent, #3b82f6); }
    .q-body { flex: 1; overflow-y: auto; border-top: 1px solid var(--line, #d8dce2); padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .q-body input[type="text"], .q-body input[type="number"], .q-body textarea {
      width: 100%; box-sizing: border-box; border: 1px solid var(--line, #d8dce2); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; outline: none; background: var(--card, #fff); color: var(--text, #222);
    }
    .q-body textarea { height: 130px; resize: none; font-size: 13px; -webkit-user-select: text; user-select: text; }
    .q-hint { font-size: 12px; color: var(--muted, #888); line-height: 1.5; }
    .q-msg { font-size: 12.5px; color: var(--ok, #2a9d4a); min-height: 17px; }
    .q-msg.err { color: var(--danger, #d43); }

    .q-item {
      border: 1px solid var(--line, #d8dce2); border-radius: 10px; background: var(--card, #fff);
      padding: 8px 10px; display: flex; align-items: center; gap: 8px;
    }
    .q-item .q-it-main { flex: 1; min-width: 0; cursor: default; }
    .q-item .q-it-owner { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-item .q-it-account { font-size: 12px; color: var(--muted, #888); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-item .q-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .q-item .q-btns button {
      border: 1px solid var(--line, #d8dce2); background: transparent; color: var(--text, #222);
      border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .q-item .q-btns button:hover { border-color: var(--accent, #3b82f6); color: var(--accent, #3b82f6); }
    .q-item .q-btns button.q-totp { color: var(--accent, #3b82f6); font-variant-numeric: tabular-nums; }
    .q-empty { text-align: center; color: var(--muted, #888); padding: 26px 0; font-size: 13px; }

    .q-gen-out code {
      display: block; word-break: break-all; -webkit-user-select: text; user-select: text;
      font-size: 14.5px; background: var(--card, #fff); border: 1px dashed var(--line, #d8dce2);
      border-radius: 10px; padding: 12px; text-align: center; letter-spacing: .5px;
    }
    .q-actions { display: flex; gap: 8px; }
    .q-actions .btn { flex: 1; }
    .q-chk { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted, #888); }
    .q-chk label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .q-save-form { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line, #d8dce2); padding-top: 10px; }
    .q-foot { padding: 6px 12px; font-size: 11.5px; color: var(--muted, #aaa); display: flex; justify-content: space-between; }
    .q-foot a { cursor: pointer; text-decoration: underline; }
    /* 深色由 html.dark 全局换 CSS 变量（theme.js），无需逐条覆盖 */
    body.quick-body { box-shadow: 0 12px 36px rgba(0,0,0,.18); }
    html.dark body.quick-body { box-shadow: 0 12px 36px rgba(0,0,0,.5); }
    .q-msg.pre { white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body class="quick-body">
  <!-- PIN 门 / 加载 / 未就绪（quick.js 按 gateView 切换） -->
  <div id="q-gate" class="q-gate hidden">
    <div class="q-gate-box" id="q-gate-box"></div>
  </div>

  <div id="q-app" class="q-app hidden">
    <div class="q-tabs">
      <button data-tab="search" class="on">🔍 搜索</button>
      <button data-tab="gen">✨ 生成</button>
      <button data-tab="import">📥 导入</button>
    </div>
    <div class="q-body">
      <!-- 搜索 -->
      <div id="tab-search" style="display:flex;flex-direction:column;gap:10px">
        <input id="q-search" type="text" placeholder="搜索 所属 / 账户 / 网址 / 备注" autocomplete="off" />
        <div id="q-results" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
      <!-- 生成 -->
      <div id="tab-gen" class="hidden" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;gap:8px;align-items:center">
          <input id="q-gen-len" type="number" min="4" max="128" value="16" style="width:80px" />
          <button class="btn primary" id="q-gen-go" style="flex:1">生成强密码</button>
        </div>
        <div class="q-chk">
          <label><input type="checkbox" id="q-gen-upper" checked />A-Z</label>
          <label><input type="checkbox" id="q-gen-lower" checked />a-z</label>
          <label><input type="checkbox" id="q-gen-digit" checked />0-9</label>
          <label><input type="checkbox" id="q-gen-symbol" checked />符号</label>
        </div>
        <div id="q-gen-block" class="hidden" style="display:flex;flex-direction:column;gap:10px">
          <div class="q-gen-out"><code id="q-gen-pw"></code></div>
          <div class="q-actions">
            <button class="btn primary" id="q-gen-copy">复制</button>
            <button class="btn" id="q-gen-save-btn">存入密码本</button>
          </div>
          <div id="q-gen-save-form" class="q-save-form hidden">
            <input id="q-save-owner" type="text" placeholder="所属（如：微信）" />
            <input id="q-save-account" type="text" placeholder="账户（如：13800138000）" />
            <div class="q-actions">
              <button class="btn primary" id="q-save-go">保存</button>
              <button class="btn" id="q-save-cancel">取消</button>
            </div>
          </div>
        </div>
        <div class="q-msg" id="q-gen-msg"></div>
      </div>
      <!-- 导入 -->
      <div id="tab-import" class="hidden" style="display:flex;flex-direction:column;gap:10px">
        <textarea id="q-import-text" placeholder="粘贴文本导入（每行一条）：&#10;微信,13800138000,P@ssw0rd1&#10;GitHub,user@example.com,Abc12345,https://github.com,主账号"></textarea>
        <div class="q-hint">格式：所属, 账户, 密码[, 网址][, 备注]；也认 中文逗号 / 斜杠 / Tab / 空格 分隔。导入走合并模式，自动跳过重复。</div>
        <div class="q-msg pre" id="q-import-preview"></div>
        <button class="btn primary" id="q-import-go">导入（合并）</button>
      </div>
    </div>
    <div class="q-foot">
      <span>Alt+P 呼出 / Esc 隐藏</span>
      <a id="q-open-main">打开主界面</a>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="generator.js"></script>
  <script src="totp.js"></script>
  <script src="quick-core.js"></script>
  <script src="importer.js"></script>
  <script src="quick.js"></script>
</body>
</html>
