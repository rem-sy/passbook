[package]
name = "passbook-desktop"
version = "4.12.4"
description = "密码本桌面端：强密码生成与密码管理"
authors = ["passbook"]
edition = "2021"

[lib]
name = "passbook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tauri-plugin-updater = "2"
# v4.11.0：开机自启动（桌面）
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
# v4.11.4 复制图片到剪贴板：PNG 解码为 DIB（仅 png 特性，最小体积）
image = { version = "0.25", default-features = false, features = ["png"] }
# v4.3.0 随手记：全局快捷键 + 剪贴板读取（仅桌面 Windows 构建）
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
